<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScholarOS v2</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><strong>ScholarOS</strong><button class="icon-button" id="closeSidebar" aria-label="Đóng menu">×</button></div>
      <nav class="sidebar-nav" aria-label="Điều hướng">
        <a href="#dashboard" data-route="dashboard">🏠 Dashboard</a>
        <a href="#ai-chat" data-route="ai-chat">🤖 AI Chat</a>
        <a href="#ai-study" data-route="ai-study">📖 Study Assistant</a>
        <a href="#ai-planner" data-route="ai-planner">🧠 AI Planner</a>
        <a href="#academic" data-route="academic">📚 Học tập</a>
        <a href="#schedule" data-route="schedule">🗓️ Lịch học</a>
        <a href="#tasks" data-route="tasks">✓ Công việc</a>
        <a href="#focus" data-route="focus">⏱ Focus</a>
        <a href="#habits" data-route="habits">♻ Thói quen</a>
        <a href="#goals" data-route="goals">🎯 Mục tiêu</a>
        <a href="#progress" data-route="progress">📈 Tiến độ</a>
        <a href="#notes" data-route="notes">📝 Ghi chú</a>
        <a href="#college" data-route="college">🎓 Đại học</a>
        <a href="#account" data-route="account">👤 Tài khoản</a>
        <a href="#settings" data-route="settings">⚙ Cài đặt</a>
      </nav>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <main class="main-content">
      <header class="top-header"><button class="icon-button mobile-only" id="openSidebar" aria-label="Mở menu">☰</button><div class="header-context"><span class="status-dot"></span><span>ScholarOS v2 Study Core</span></div><div class="header-actions"><button class="header-action" id="searchButton" title="Tìm kiếm"><span>⌕</span><span class="desktop-only">Tìm kiếm</span></button><button class="header-action auth-header-login" id="loginButton" title="Đăng nhập"><span>↪</span><span class="desktop-only">Đăng nhập</span></button><button class="header-action auth-header-signup" id="signupButton" title="Đăng ký"><span>＋</span><span class="desktop-only">Đăng ký</span></button><button class="header-action" id="themeButton" title="Đổi giao diện"><span id="themeIcon">☾</span><span class="desktop-only">Giao diện</span></button></div></header>
      <section class="page-container"><div class="page-heading"><div><p class="eyebrow" id="pageEyebrow">PERSONAL LEARNING SYSTEM</p><h1 id="pageTitle">Dashboard</h1><p id="pageDescription">Tập trung vào việc học quan trọng nhất hôm nay.</p></div><div class="page-heading-actions"><div class="streak-pill">🔥 <strong id="streakValue">0</strong> ngày</div><button class="button primary" id="quickFocus">▶ Bắt đầu Focus</button></div></div><section id="appView" aria-live="polite"></section></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/features/drive-preview.js"></script>
  <script type="module" src="js/features/drive-state-fix.js"></script>
  <script type="module" src="js/features/drive-sync.js"></script>
</body>
</html>
